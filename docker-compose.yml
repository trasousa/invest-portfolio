version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8002:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      - UV_LINK_MODE=copy
      - UV_PROJECT_ENVIRONMENT=/venv
    # Use 'uv run python scripts/init_db.py' to initialize the database
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      target: build
    ports:
      - "3001:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules # Prevent host from overwriting container node_modules
    environment:
      - VITE_API_TARGET=http://backend:8000
    command: npm run dev -- --host
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
